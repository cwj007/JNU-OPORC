services:
  # --- 可视化控制台 (Visualized Dashboard) ---
  visualized:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: jnu-oporc-visualized
    environment:
      - SERVICE_TYPE=visualized
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///app/Visualized/cache/hotsearch.db
      - CRAWLER_API_URL=http://mediacrawler:8080
    ports:
      - "8000:8000" # Dashboard API & WebUI
      - "8002:8002" # Image Server
    volumes:
      - data-volume:/app/Visualized/data
      - cache-volume:/app/Visualized/cache
      - media-volume:/app/MediaCrawler/data
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - oporc-network

  # --- 数据采集模块 (MediaCrawler) ---
  mediacrawler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: jnu-oporc-mediacrawler
    environment:
      - SERVICE_TYPE=mediacrawler
      - REDIS_URL=redis://redis:6379/1
      - DATABASE_URL=sqlite:///app/MediaCrawler/database/sqlite_tables.db
    ports:
      - "8080:8080" # MediaCrawler API
    volumes:
      - media-volume:/app/MediaCrawler/data
      - crawler-db-volume:/app/MediaCrawler/database
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - oporc-network

  # --- Redis 缓存服务 ---
  redis:
    image: redis:alpine
    container_name: jnu-oporc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - oporc-network

networks:
  oporc-network:
    driver: bridge

volumes:
  data-volume:
  cache-volume:
  media-volume:
  crawler-db-volume:
  redis-data:
