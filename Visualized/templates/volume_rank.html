<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声量热榜 - JNU-OPORC 舆情哨兵</title>
    <script>
        // Auth Check
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }
    </script>
    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.3.8/dist/index.css">
    <link rel="stylesheet" href="/static/css/style.css?t={{ range(1, 10000) | random }}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-plus/dist/index.full.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue/dist/index.iife.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div id="app" v-cloak>
        <div class="data-stream-container" id="dataStream"></div>

        <div class="sidebar" :class="{ collapsed: isCollapse, active: !isCollapse }">
            <div class="sidebar-logo">{{ isCollapse ? 'OPORC' : 'JNU-OPORC 舆情哨兵' }}</div>
            <el-menu
                active-text-color="var(--primary-color)"
                background-color="transparent"
                class="el-menu-vertical"
                default-active="volume_rank"
                :collapse="isCollapse"
                text-color="var(--text-secondary)"
                @select="handleMenuSelect"
            >
                <el-menu-item index="hotsearch">
                    <el-icon><trend-charts /></el-icon>
                    <template #title>平台热榜</template>
                </el-menu-item>
                <el-menu-item index="dashboard">
                    <el-icon><data-line /></el-icon>
                    <template #title>舆情仪表盘</template>
                </el-menu-item>
                <el-menu-item index="monitor">
                    <el-icon><monitor /></el-icon>
                    <template #title>舆情检测</template>
                </el-menu-item>
                <el-menu-item index="warning">
                    <el-icon><bell /></el-icon>
                    <template #title>预警中心</template>
                </el-menu-item>
                <el-menu-item index="volume_rank">
                    <el-icon><histogram /></el-icon>
                    <template #title>声量热榜</template>
                </el-menu-item>
                <el-menu-item index="crawler" v-if="['admin', 'root', 'user'].includes(userRole)">
                    <el-icon><share /></el-icon>
                    <template #title>爬虫管理</template>
                </el-menu-item>
                <el-menu-item index="users" v-if="['admin', 'root'].includes(userRole)">
                    <el-icon><user-filled /></el-icon>
                    <template #title>用户管理</template>
                </el-menu-item>

            </el-menu>
        </div>

        <div class="main-container">
            <div class="header">
                <div style="display: flex; align-items: center;">
                    <el-icon class="collapse-btn" @click="isCollapse = !isCollapse">
                        <expand v-if="isCollapse"></expand>
                        <fold v-else></fold>
                    </el-icon>
                    <el-breadcrumb separator="/">
                        <el-breadcrumb-item>首页</el-breadcrumb-item>
                        <el-breadcrumb-item>声量热榜</el-breadcrumb-item>
                    </el-breadcrumb>
                </div>
                <div style="display: flex; align-items: center; gap: 20px;">
                    <div class="user-profile">
                        <el-dropdown @command="handleCommand">
                            <span class="el-dropdown-link" style="cursor: pointer; display: flex; align-items: center;">
                                <el-avatar :size="32" src="https://cube.elemecdn.com/0/88/03b0d39583f48206768a7534e55bcpng.png"></el-avatar>
                                <span style="margin-left: 8px; color: var(--text-primary);">{{ username }}</span>
                            </span>
                            <template #dropdown>
                                <el-dropdown-menu>
                                    <el-dropdown-item command="profile">个人设置</el-dropdown-item>
                                    <el-dropdown-item command="logout">退出登录</el-dropdown-item>
                                </el-dropdown-menu>
                            </template>
                        </el-dropdown>
                    </div>
                </div>
            </div>

            <div class="content">
                <el-card class="rank-card" shadow="never">
                    <template #header>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-size: 18px; font-weight: 800; font-family: 'Orbitron', sans-serif; color: var(--primary-color);">影响力排行榜</span>
                            <el-radio-group v-model="platformFilter" size="small">
                                <el-radio-button label="all">全部</el-radio-button>
                                <el-radio-button label="weibo">微博</el-radio-button>
                                <el-radio-button label="zhihu">知乎</el-radio-button>
                            </el-radio-group>
                        </div>
                    </template>

                    <div v-loading="loading" element-loading-background="rgba(0,0,0,0.5)">
                        <div v-for="(item, index) in filteredRankData" :key="item.id" class="rank-item">
                            <div class="rank-number">{{ index + 1 }}</div>
                            <img :src="processAvatarUrl(item.avatar)" class="author-avatar" referrerpolicy="no-referrer" @error="handleImageError" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-right: 12px; border: 1px solid #EBEEF5; display: block;">
                            <div class="author-info">
                                <div class="author-name">
                                    {{ item.name }}
                                    <span class="platform-tag">{{ item.platform }}</span>
                                </div>
                                <div style="font-size: 12px; color: var(--text-secondary);">{{ item.description }}</div>
                            </div>
                            <div class="stats-grid">
                                <div class="stat-item">
                                    <span class="stat-label">粉丝数</span>
                                    <span class="stat-value">{{ formatNumber(item.followers) }}</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">互动总量</span>
                                    <span class="stat-value">{{ formatNumber(item.engagement) }}</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-label">影响力指数</span>
                                    <span class="stat-value">{{ item.influence }}</span>
                                </div>
                            </div>
                        </div>
                        <el-empty v-if="!loading && filteredRankData.length === 0" description="暂无数据"></el-empty>
                    </div>
                </el-card>
            </div>
        </div>

        <el-dialog v-model="profileDialogVisible" title="个人设置" width="450px" class="tech-dialog">
            <div class="dialog-tech-decor"></div>
            <el-form :model="profileForm" label-width="100px" style="padding: 20px 30px;">
                <div class="form-section-title">基本信息</div>
                <el-form-item label="用户名">
                    <el-input v-model="username" disabled class="tech-input"></el-input>
                </el-form-item>
                <el-form-item label="邮箱地址">
                    <el-input v-model="profileForm.email" placeholder="用于接收预警的邮箱" class="tech-input"></el-input>
                </el-form-item>
                <el-form-item label="邮件提醒">
                    <el-switch 
                        v-model="profileForm.email_notify_enabled" 
                        active-text="开启" 
                        inactive-text="关闭"
                        :active-value="1"
                        :inactive-value="0"
                        class="tech-switch"
                    ></el-switch>
                </el-form-item>

                <div class="form-section-title" style="margin-top: 25px;">安全设置</div>
                <el-form-item label="旧密码">
                    <el-input v-model="profileForm.old_password" type="password" placeholder="若修改密码请填写旧密码" show-password class="tech-input"></el-input>
                </el-form-item>
                <el-form-item label="新密码">
                    <el-input v-model="profileForm.new_password" type="password" placeholder="不修改请留空" show-password class="tech-input"></el-input>
                </el-form-item>
                <el-form-item label="确认新密码">
                    <el-input v-model="profileForm.confirm_password" type="password" placeholder="请再次输入新密码" show-password class="tech-input"></el-input>
                </el-form-item>
                
                <div class="tech-hint">
                    <i class="el-icon-info"></i> 开启邮件提醒后，触发预警规则时将向此邮箱发送通知
                </div>
            </el-form>
            <template #footer>
                <div class="dialog-footer">
                    <el-button @click="profileDialogVisible = false" class="tech-btn-secondary">取消</el-button>
                    <el-button type="primary" @click="saveProfile" :loading="profileSaving" class="tech-btn-primary">保存系统设置</el-button>
                </div>
            </template>
        </el-dialog>
    </div>
</div>

    <script>
        const { createApp, ref, computed, onMounted, watch } = Vue;
        const app = createApp({
            setup() {
                const username = ref(localStorage.getItem('username') || 'Admin');
                const userRole = ref(localStorage.getItem('role') || 'user');
                const isCollapse = ref(localStorage.getItem('sidebarCollapse') === 'true');
                console.log('Volume Rank page sidebar collapse state:', isCollapse.value);
                
                watch(isCollapse, (val) => {
                    console.log('Volume Rank page sidebar collapse changed to:', val);
                    localStorage.setItem('sidebarCollapse', val ? 'true' : 'false');
                });

                // 个人设置相关
                const profileDialogVisible = ref(false);
                const profileSaving = ref(false);
                const profileForm = ref({
                    email: '',
                    email_notify_enabled: 1,
                    old_password: '',
                    new_password: '',
                    confirm_password: ''
                });

                const fetchProfile = async () => {
                    try {
                        const res = await axios.get('/api/auth/profile');
                        profileForm.value = {
                            email: res.data.email || '',
                            email_notify_enabled: res.data.email_notify_enabled === 0 ? 0 : 1,
                            old_password: '',
                            new_password: '',
                            confirm_password: ''
                        };
                    } catch (e) {
                        console.error('Failed to fetch profile', e);
                    }
                };

                const saveProfile = async () => {
                    if (profileForm.value.new_password) {
                        if (!profileForm.value.old_password) {
                            ElementPlus.ElMessage.warning('修改密码时必须填写旧密码');
                            return;
                        }
                        if (profileForm.value.new_password.length < 6) {
                            ElementPlus.ElMessage.warning('新密码长度不能少于6位');
                            return;
                        }
                        if (profileForm.value.new_password !== profileForm.value.confirm_password) {
                            ElementPlus.ElMessage.warning('两次输入的新密码不一致');
                            return;
                        }
                    }

                    if (profileForm.value.email) {
                        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                        if (!emailRegex.test(profileForm.value.email)) {
                            ElementPlus.ElMessage.warning('请输入有效的邮箱地址');
                            return;
                        }
                    }

                    profileSaving.value = true;
                    try {
                        const res = await axios.post('/api/auth/profile', profileForm.value);
                        if (res.data.status === 'success') {
                            ElementPlus.ElMessage.success('个人设置保存成功');
                            profileDialogVisible.value = false;
                        } else {
                            ElementPlus.ElMessage.error(res.data.message || '保存失败');
                        }
                    } catch (e) {
                        console.error('Save profile error:', e);
                        ElementPlus.ElMessage.error(e.response?.data?.message || '保存个人设置失败');
                    } finally {
                        profileSaving.value = false;
                        profileForm.value.old_password = '';
                        profileForm.value.new_password = '';
                        profileForm.value.confirm_password = '';
                    }
                };

                const handleCommand = (command) => {
                    if (command === 'logout') {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user_id');
                        localStorage.removeItem('username');
                        localStorage.removeItem('role');
                        window.location.href = '/login';
                    } else if (command === 'profile') {
                        fetchProfile();
                        profileDialogVisible.value = true;
                    }
                };
                const platformFilter = ref('all');
                
                const rankData = ref([]);
                const loading = ref(false);

                const fetchRankData = async () => {
                    loading.value = true;
                    try {
                        const response = await axios.get(`/api/rank/influencers?platform=${platformFilter.value}`);
                        if (response.data.status === 'success') {
                            rankData.value = response.data.data;
                        }
                    } catch (error) {
                        console.error('Fetch rank data error:', error);
                        ElementPlus.ElMessage.error('获取榜单数据失败');
                    } finally {
                        loading.value = false;
                    }
                };

                const filteredRankData = computed(() => {
                    return rankData.value;
                });

                const handleMenuSelect = (index) => {
                    console.log('Menu selected:', index);
                    if (!index) return;
                    
                    const currentPath = window.location.pathname;
                    const targetPath = index === 'dashboard' ? '/' : `/${index}`;
                    
                    if (currentPath === targetPath || (currentPath === '/' && index === 'dashboard')) {
                        console.log('Already on target page:', index);
                        return;
                    }

                    const externalPages = ['hotsearch', 'volume_rank', 'crawler', 'monitor', 'warning', 'users'];
                    if (externalPages.includes(index)) {
                        window.location.href = `/${index}`;
                    } else if (index === 'dashboard') {
                        window.location.href = '/';
                    }
                };

                watch(platformFilter, () => {
                    fetchRankData();
                });

                const formatNumber = (num) => {
                    if (!num) return '0';
                    if (num >= 100000000) return (num / 100000000).toFixed(1) + '亿';
                    if (num >= 10000) return (num / 10000).toFixed(1) + '万';
                    return num;
                };

                const handleImageError = (e) => {
                    e.target.src = "https://cube.elemecdn.com/3/7c/3ea6beec64369c2642b92c6726f1epng.png";
                };

                const processAvatarUrl = (url) => {
                    if (!url) return "https://cube.elemecdn.com/3/7c/3ea6beec64369c2642b92c6726f1epng.png";
                    // 如果是微博图片，使用后端代理
                    if (url.includes('sinaimg.cn') || url.includes('weibo.com')) {
                        return `/api/rank/proxy-image?url=${encodeURIComponent(url)}`;
                    }
                    return url;
                };

                onMounted(() => {
                    fetchRankData();
                    const container = document.getElementById('dataStream');
                    for (let i = 0; i < 20; i++) {
                        const p = document.createElement('div');
                        p.className = 'data-particle';
                        p.style.left = Math.random() * 100 + 'vw';
                        p.style.animationDuration = (Math.random() * 3 + 2) + 's';
                        p.style.animationDelay = Math.random() * 5 + 's';
                        container.appendChild(p);
                    }
                });

                return { username, handleCommand, userRole, isCollapse, platformFilter, filteredRankData, formatNumber, handleMenuSelect, handleImageError, processAvatarUrl, profileDialogVisible, profileSaving, profileForm, saveProfile };
            }
        });
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }
        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
