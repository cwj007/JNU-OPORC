<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - JNU-OPORC</title>
    <script>
        // Auth Check
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-plus"></script>
    <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue"></script>
</head>
<body>
    <div id="app">
        <div class="sidebar" :class="{ collapsed: isCollapse }">
            <div class="sidebar-logo">{{ isCollapse ? 'OPORC' : 'JNU-OPORC 舆情哨兵' }}</div>
            <el-menu
                active-text-color="var(--primary-color)"
                background-color="transparent"
                class="el-menu-vertical"
                default-active="users"
                :collapse="isCollapse"
                text-color="var(--text-secondary)"
                @select="handleMenuSelect"
            >
                <el-menu-item index="hotsearch">
                    <el-icon><trend-charts /></el-icon>
                    <template #title>平台热榜</template>
                </el-menu-item>
                <el-menu-item index="dashboard">
                    <el-icon><data-line /></el-icon>
                    <template #title>舆情仪表盘</template>
                </el-menu-item>
                <el-menu-item index="monitor">
                    <el-icon><monitor /></el-icon>
                    <template #title>舆情检测</template>
                </el-menu-item>
                <el-menu-item index="warning">
                    <el-icon><bell /></el-icon>
                    <template #title>预警中心</template>
                </el-menu-item>
                <el-menu-item index="volume_rank">
                    <el-icon><histogram /></el-icon>
                    <template #title>声量热榜</template>
                </el-menu-item>
                <el-menu-item index="crawler" v-if="['admin', 'root', 'user'].includes(userRole)">
                    <el-icon><share /></el-icon>
                    <template #title>爬虫管理</template>
                </el-menu-item>
                <el-menu-item index="users" v-if="['admin', 'root'].includes(userRole)">
                    <el-icon><user /></el-icon>
                    <template #title>用户管理</template>
                </el-menu-item>
            </el-menu>
        </div>

        <div class="main-container">
            <div class="sticky-header-wrapper">
                <div class="header">
                    <div style="display: flex; align-items: center;">
                        <el-icon class="collapse-btn" @click="isCollapse = !isCollapse">
                            <expand v-if="isCollapse"></expand>
                            <fold v-else></fold>
                        </el-icon>
                        <el-breadcrumb separator="/">
                            <el-breadcrumb-item>首页</el-breadcrumb-item>
                            <el-breadcrumb-item>用户管理</el-breadcrumb-item>
                        </el-breadcrumb>
                    </div>
                    <div class="user-profile">
                        <el-dropdown @command="handleCommand">
                            <span class="el-dropdown-link">
                                <el-avatar :size="32" src="https://cube.elemecdn.com/0/88/03b0d39583f48206768a7534e55bcpng.png"></el-avatar>
                                <span style="margin-left: 8px; color: var(--text-primary);">{{ username }}</span>
                            </span>
                            <template #dropdown>
                                <el-dropdown-menu>
                                    <el-dropdown-item command="profile">个人设置</el-dropdown-item>
                                    <el-dropdown-item command="logout">退出登录</el-dropdown-item>
                                </el-dropdown-menu>
                            </template>
                        </el-dropdown>
                    </div>
                </div>
            </div>

            <div class="content" style="padding: 24px;">
                <el-card class="hot-card">
                    <template #header>
                        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                            <span>用户列表</span>
                            <el-button 
                                class="cyber-btn-detail" 
                                @click="handleAddUser"
                            >
                                <div class="ui-prefix"><span></span><span></span><span></span></div>
                                添加用户
                            </el-button>
                        </div>
                    </template>
                    
                    <el-table :data="users" style="width: 100%" v-loading="loading">
                        <el-table-column prop="id" label="ID" width="80"></el-table-column>
                        <el-table-column prop="username" label="用户名"></el-table-column>
                        <el-table-column prop="role" label="角色">
                            <template #default="scope">
                                <el-tag :type="scope.row.role === 'admin' ? 'danger' : 'info'">{{ scope.row.role }}</el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column prop="email" label="邮箱"></el-table-column>
                        <el-table-column prop="created_at" label="创建时间"></el-table-column>
                        <el-table-column label="操作" width="220">
                            <template #default="scope">
                                <div style="display: flex; gap: 12px; align-items: center;">
                                    <el-button 
                                        size="small" 
                                        class="cyber-btn-detail"
                                        @click="handleEdit(scope.row)"
                                        :disabled="scope.row.username === 'root'"
                                    >
                                        <div class="ui-prefix"><span></span><span></span><span></span></div>
                                        修改
                                    </el-button>
                                    <el-button 
                                        size="small" 
                                        class="cyber-btn-delete"
                                        @click="handleDelete(scope.row)"
                                        :disabled="scope.row.username === 'root' || scope.row.username === username"
                                    >
                                        <div class="ui-prefix"><span></span><span></span><span></span></div>
                                        删除
                                    </el-button>
                                </div>
                            </template>
                        </el-table-column>
                    </el-table>
                </el-card>

                <el-dialog
                    v-model="dialogVisible"
                    :title="isEdit ? '修改用户' : '添加用户'"
                    width="30%"
                    class="tech-dialog"
                >
                    <el-form :model="newUser" label-width="80px" class="tech-form">
                        <el-form-item label="用户名">
                            <el-input v-model="newUser.username" :disabled="isEdit"></el-input>
                        </el-form-item>
                        <el-form-item label="邮箱">
                            <el-input v-model="newUser.email" placeholder="请输入邮箱"></el-input>
                        </el-form-item>
                        <el-form-item label="密码">
                            <el-input v-model="newUser.password" type="password" show-password :placeholder="isEdit ? '留空表示不修改' : '留空默认为 123456'"></el-input>
                        </el-form-item>
                        <el-form-item label="角色">
                            <el-select v-model="newUser.role" placeholder="Select" style="width: 100%" popper-class="tech-popper">
                                <el-option label="User" value="user"></el-option>
                                <el-option label="Admin" value="admin"></el-option>
                            </el-select>
                        </el-form-item>
                    </el-form>
                    <template #footer>
                        <div class="dialog-footer" style="display: flex; justify-content: flex-end; gap: 12px; align-items: center;">
                            <el-button 
                                class="cyber-btn-detail" 
                                @click="handleSubmit" 
                                :loading="creating"
                            >
                                <div class="ui-prefix"><span></span><span></span><span></span></div>
                                确认
                            </el-button>
                            <el-button 
                                class="cyber-btn-delete" 
                                @click="dialogVisible = false"
                            >
                                <div class="ui-prefix"><span></span><span></span><span></span></div>
                                取消
                            </el-button>
                        </div>
                    </template>
                </el-dialog>

                <el-dialog v-model="profileDialogVisible" title="个人设置" width="450px" class="tech-dialog">
                    <div class="dialog-tech-decor"></div>
                    <el-form :model="profileForm" label-width="100px" style="padding: 20px 30px;">
                        <div class="form-section-title">基本信息</div>
                        <el-form-item label="用户名">
                            <el-input v-model="username" disabled class="tech-input"></el-input>
                        </el-form-item>
                        <el-form-item label="邮箱地址">
                            <el-input v-model="profileForm.email" placeholder="用于接收预警的邮箱" class="tech-input"></el-input>
                        </el-form-item>
                        <el-form-item label="邮件提醒">
                            <el-switch 
                                v-model="profileForm.email_notify_enabled" 
                                active-text="开启" 
                                inactive-text="关闭"
                                :active-value="1"
                                :inactive-value="0"
                                class="tech-switch"
                            ></el-switch>
                        </el-form-item>

                        <div class="form-section-title" style="margin-top: 25px;">安全设置</div>
                        <el-form-item label="旧密码">
                            <el-input v-model="profileForm.old_password" type="password" placeholder="若修改密码请填写旧密码" show-password class="tech-input"></el-input>
                        </el-form-item>
                        <el-form-item label="新密码">
                            <el-input v-model="profileForm.new_password" type="password" placeholder="不修改请留空" show-password class="tech-input"></el-input>
                        </el-form-item>
                        <el-form-item label="确认新密码">
                            <el-input v-model="profileForm.confirm_password" type="password" placeholder="请再次输入新密码" show-password class="tech-input"></el-input>
                        </el-form-item>
                        
                        <div class="tech-hint">
                            <i class="el-icon-info"></i> 开启邮件提醒后，触发预警规则时将向此邮箱发送通知
                        </div>
                    </el-form>
                    <template #footer>
                        <div class="dialog-footer">
                            <el-button @click="profileDialogVisible = false" class="tech-btn-secondary">取消</el-button>
                            <el-button type="primary" @click="saveProfile" :loading="profileSaving" class="tech-btn-primary">保存系统设置</el-button>
                        </div>
                    </template>
                </el-dialog>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, reactive } = Vue;

        const app = createApp({
            setup() {
                const isCollapse = ref(false);
                const users = ref([]);
                const loading = ref(false);
                const dialogVisible = ref(false);
                const isEdit = ref(false);
                const currentUserId = ref(null);
                const creating = ref(false);
                const username = ref(localStorage.getItem('username') || 'Admin');
                const userRole = ref(localStorage.getItem('role') || 'user');

                // 个人设置相关
                const profileDialogVisible = ref(false);
                const profileSaving = ref(false);
                const profileForm = ref({
                    email: '',
                    email_notify_enabled: 1,
                    old_password: '',
                    new_password: '',
                    confirm_password: ''
                });

                const fetchProfile = async () => {
                    try {
                        const res = await axios.get('/api/auth/profile');
                        profileForm.value = {
                            email: res.data.email || '',
                            email_notify_enabled: res.data.email_notify_enabled === 0 ? 0 : 1,
                            old_password: '',
                            new_password: '',
                            confirm_password: ''
                        };
                    } catch (e) {
                        console.error('Failed to fetch profile', e);
                    }
                };

                const saveProfile = async () => {
                    if (profileForm.value.new_password) {
                        if (!profileForm.value.old_password) {
                            ElementPlus.ElMessage.warning('修改密码时必须填写旧密码');
                            return;
                        }
                        if (profileForm.value.new_password.length < 6) {
                            ElementPlus.ElMessage.warning('新密码长度不能少于6位');
                            return;
                        }
                        if (profileForm.value.new_password !== profileForm.value.confirm_password) {
                            ElementPlus.ElMessage.warning('两次输入的新密码不一致');
                            return;
                        }
                    }

                    if (profileForm.value.email) {
                        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                        if (!emailRegex.test(profileForm.value.email)) {
                            ElementPlus.ElMessage.warning('请输入有效的邮箱地址');
                            return;
                        }
                    }

                    profileSaving.value = true;
                    try {
                        const res = await axios.post('/api/auth/profile', profileForm.value);
                        if (res.data.status === 'success') {
                            ElementPlus.ElMessage.success('个人设置保存成功');
                            profileDialogVisible.value = false;
                        } else {
                            ElementPlus.ElMessage.error(res.data.message || '保存失败');
                        }
                    } catch (e) {
                        console.error('Save profile error:', e);
                        ElementPlus.ElMessage.error(e.response?.data?.message || '保存个人设置失败');
                    } finally {
                        profileSaving.value = false;
                        profileForm.value.old_password = '';
                        profileForm.value.new_password = '';
                        profileForm.value.confirm_password = '';
                    }
                };

                const newUser = reactive({
                    username: '',
                    password: '',
                    role: 'user',
                    email: ''
                });

                const handleAddUser = () => {
                    isEdit.value = false;
                    currentUserId.value = null;
                    newUser.username = '';
                    newUser.password = '';
                    newUser.role = 'user';
                    newUser.email = '';
                    dialogVisible.value = true;
                };

                const handleEdit = (row) => {
                    isEdit.value = true;
                    currentUserId.value = row.id;
                    newUser.username = row.username;
                    newUser.password = '';
                    newUser.role = row.role;
                    newUser.email = row.email || '';
                    dialogVisible.value = true;
                };

                const handleSubmit = async () => {
                    if (!newUser.username) {
                        ElementPlus.ElMessage.warning('用户名不能为空');
                        return;
                    }

                    // 邮箱格式验证
                    if (newUser.email && newUser.email.trim() !== '') {
                        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                        if (!emailRegex.test(newUser.email)) {
                            ElementPlus.ElMessage.warning('请输入有效的邮箱格式');
                            return;
                        }
                    }

                    creating.value = true;
                    try {
                        const token = localStorage.getItem('token');
                        if (isEdit.value) {
                            await axios.put(`/api/auth/users/${currentUserId.value}`, newUser, {
                                headers: { Authorization: `Bearer ${token}` }
                            });
                            ElementPlus.ElMessage.success('用户修改成功');
                        } else {
                            await axios.post('/api/auth/users', newUser, {
                                headers: { Authorization: `Bearer ${token}` }
                            });
                            ElementPlus.ElMessage.success('用户创建成功');
                        }
                        dialogVisible.value = false;
                        fetchUsers();
                    } catch (err) {
                        ElementPlus.ElMessage.error((isEdit.value ? '修改' : '创建') + '失败: ' + (err.response?.data?.detail || err.message));
                    } finally {
                        creating.value = false;
                    }
                };

                const handleMenuSelect = (index) => {
                    if (index === 'users') return;
                    
                    const routes = {
                        dashboard: '/',
                        hotsearch: '/hotsearch',
                        monitor: '/monitor',
                        warning: '/warning',
                        volume_rank: '/volume_rank',
                        crawler: '/crawler',
                        users: '/users'
                    };
                    
                    if (routes[index]) {
                        window.location.href = routes[index];
                    }
                };

                const handleCommand = (command) => {
                    if (command === 'logout') {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user_id');
                        localStorage.removeItem('username');
                        localStorage.removeItem('role');
                        window.location.href = '/login';
                    } else if (command === 'profile') {
                        fetchProfile();
                        profileDialogVisible.value = true;
                    }
                };

                const fetchUsers = async () => {
                    loading.value = true;
                    try {
                        const token = localStorage.getItem('token');
                        const res = await axios.get('/api/auth/users', {
                            headers: { Authorization: `Bearer ${token}` }
                        });
                        users.value = res.data;
                    } catch (err) {
                        ElementPlus.ElMessage.error('获取用户列表失败: ' + (err.response?.data?.detail || err.message));
                        if (err.response?.status === 401 || err.response?.status === 403) {
                             window.location.href = '/login';
                        }
                    } finally {
                        loading.value = false;
                    }
                };

                const handleDelete = async (row) => {
                    try {
                        await ElementPlus.ElMessageBox.confirm('确认删除该用户吗？', '提示', {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        });
                        
                        const token = localStorage.getItem('token');
                        await axios.delete(`/api/auth/users/${row.id}`, {
                            headers: { Authorization: `Bearer ${token}` }
                        });
                        ElementPlus.ElMessage.success('删除成功');
                        fetchUsers();
                    } catch (e) {
                        if (e !== 'cancel') {
                            ElementPlus.ElMessage.error('删除失败');
                        }
                    }
                };

                onMounted(() => {
                    if (!['admin', 'root'].includes(userRole.value)) {
                        ElementPlus.ElMessage.error('无权访问');
                        setTimeout(() => window.location.href = '/', 1000);
                        return;
                    }
                    fetchUsers();
                });

                return {
                    isCollapse,
                    users,
                    loading,
                    dialogVisible,
                    isEdit,
                    creating,
                    newUser,
                    username,
                    userRole,
                    handleMenuSelect,
                    handleCommand,
                    handleAddUser,
                    handleEdit,
                    handleSubmit,
                    handleDelete,
                    profileDialogVisible,
                    profileSaving,
                    profileForm,
                    saveProfile
                };
            }
        });

        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }
        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
