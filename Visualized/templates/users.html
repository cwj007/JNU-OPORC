<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - JNU-OPORC</title>
    <script>
        // Auth Check
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login';
        }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-plus"></script>
    <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue"></script>
</head>
<body>
    <div id="app">
        <div class="sidebar" :class="{ collapsed: isCollapse }">
            <div class="sidebar-logo">{{ isCollapse ? 'OPORC' : 'JNU-OPORC 舆情哨兵' }}</div>
            <el-menu
                active-text-color="var(--primary-color)"
                background-color="transparent"
                class="el-menu-vertical"
                default-active="users"
                :collapse="isCollapse"
                text-color="var(--text-secondary)"
                @select="handleMenuSelect"
            >
                <el-menu-item index="hotsearch">
                    <el-icon><trend-charts /></el-icon>
                    <template #title>平台热榜</template>
                </el-menu-item>
                <el-menu-item index="dashboard">
                    <el-icon><data-line /></el-icon>
                    <template #title>舆情仪表盘</template>
                </el-menu-item>
                <el-menu-item index="monitor">
                    <el-icon><monitor /></el-icon>
                    <template #title>舆情检测</template>
                </el-menu-item>
                <el-menu-item index="warning">
                    <el-icon><bell /></el-icon>
                    <template #title>预警中心</template>
                </el-menu-item>
                <el-menu-item index="volume_rank">
                    <el-icon><histogram /></el-icon>
                    <template #title>声量热榜</template>
                </el-menu-item>
                <el-menu-item index="crawler" v-if="['admin', 'root', 'user'].includes(userRole)">
                    <el-icon><share /></el-icon>
                    <template #title>爬虫管理</template>
                </el-menu-item>
                <el-menu-item index="users" v-if="['admin', 'root'].includes(userRole)">
                    <el-icon><user /></el-icon>
                    <template #title>用户管理</template>
                </el-menu-item>
            </el-menu>
        </div>

        <div class="main-container">
            <div class="sticky-header-wrapper">
                <div class="header">
                    <div style="display: flex; align-items: center;">
                        <el-icon class="collapse-btn" @click="isCollapse = !isCollapse">
                            <expand v-if="isCollapse"></expand>
                            <fold v-else></fold>
                        </el-icon>
                        <el-breadcrumb separator="/">
                            <el-breadcrumb-item>首页</el-breadcrumb-item>
                            <el-breadcrumb-item>用户管理</el-breadcrumb-item>
                        </el-breadcrumb>
                    </div>
                    <div class="user-profile">
                        <el-dropdown @command="handleCommand">
                            <span class="el-dropdown-link">
                                <el-avatar :size="32" src="https://cube.elemecdn.com/0/88/03b0d39583f48206768a7534e55bcpng.png"></el-avatar>
                                <span style="margin-left: 8px; color: var(--text-primary);">{{ username }}</span>
                            </span>
                            <template #dropdown>
                                <el-dropdown-menu>
                                    <el-dropdown-item command="logout">退出登录</el-dropdown-item>
                                </el-dropdown-menu>
                            </template>
                        </el-dropdown>
                    </div>
                </div>
            </div>

            <div class="content" style="padding: 24px;">
                <el-card class="hot-card">
                    <template #header>
                        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                            <span>用户列表</span>
                            <el-button type="primary" @click="dialogVisible = true">添加用户</el-button>
                        </div>
                    </template>
                    
                    <el-table :data="users" style="width: 100%" v-loading="loading">
                        <el-table-column prop="id" label="ID" width="80"></el-table-column>
                        <el-table-column prop="username" label="用户名"></el-table-column>
                        <el-table-column prop="role" label="角色">
                            <template #default="scope">
                                <el-tag :type="scope.row.role === 'admin' ? 'danger' : 'info'">{{ scope.row.role }}</el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column prop="created_at" label="创建时间"></el-table-column>
                        <el-table-column label="操作" width="120">
                            <template #default="scope">
                                <el-button 
                                    size="small" 
                                    type="danger" 
                                    @click="handleDelete(scope.row)"
                                    :disabled="scope.row.username === 'root' || scope.row.username === username"
                                >
                                    删除
                                </el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </el-card>

                <el-dialog
                    v-model="dialogVisible"
                    title="添加用户"
                    width="30%"
                >
                    <el-form :model="newUser" label-width="80px">
                        <el-form-item label="用户名">
                            <el-input v-model="newUser.username"></el-input>
                        </el-form-item>
                        <el-form-item label="密码">
                            <el-input v-model="newUser.password" type="password" show-password></el-input>
                        </el-form-item>
                        <el-form-item label="角色">
                            <el-select v-model="newUser.role" placeholder="Select">
                                <el-option label="User" value="user"></el-option>
                                <el-option label="Admin" value="admin"></el-option>
                            </el-select>
                        </el-form-item>
                    </el-form>
                    <template #footer>
                        <span class="dialog-footer">
                            <el-button @click="dialogVisible = false">取消</el-button>
                            <el-button type="primary" @click="handleCreate" :loading="creating">
                                确认
                            </el-button>
                        </span>
                    </template>
                </el-dialog>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, reactive } = Vue;

        const app = createApp({
            setup() {
                const isCollapse = ref(false);
                const users = ref([]);
                const loading = ref(false);
                const dialogVisible = ref(false);
                const creating = ref(false);
                const username = ref(localStorage.getItem('username') || 'Admin');
                const userRole = ref(localStorage.getItem('role') || 'user');

                const newUser = reactive({
                    username: '',
                    password: '',
                    role: 'user'
                });

                const handleMenuSelect = (index) => {
                    if (index === 'users') return;
                    
                    const routes = {
                        dashboard: '/',
                        hotsearch: '/hotsearch',
                        monitor: '/monitor',
                        warning: '/warning',
                        volume_rank: '/volume_rank',
                        crawler: '/crawler',
                        users: '/users'
                    };
                    
                    if (routes[index]) {
                        window.location.href = routes[index];
                    }
                };

                const handleCommand = (command) => {
                    if (command === 'logout') {
                        localStorage.removeItem('token');
                        localStorage.removeItem('username');
                        localStorage.removeItem('role');
                        window.location.href = '/login';
                    }
                };

                const fetchUsers = async () => {
                    loading.value = true;
                    try {
                        const token = localStorage.getItem('token');
                        const res = await axios.get('/api/auth/users', {
                            headers: { Authorization: `Bearer ${token}` }
                        });
                        users.value = res.data;
                    } catch (err) {
                        ElementPlus.ElMessage.error('获取用户列表失败: ' + (err.response?.data?.detail || err.message));
                        if (err.response?.status === 401 || err.response?.status === 403) {
                             window.location.href = '/login';
                        }
                    } finally {
                        loading.value = false;
                    }
                };

                const handleCreate = async () => {
                    if (!newUser.username || !newUser.password) {
                        ElementPlus.ElMessage.warning('请填写完整信息');
                        return;
                    }
                    creating.value = true;
                    try {
                        const token = localStorage.getItem('token');
                        await axios.post('/api/auth/users', newUser, {
                            headers: { Authorization: `Bearer ${token}` }
                        });
                        ElementPlus.ElMessage.success('用户创建成功');
                        dialogVisible.value = false;
                        fetchUsers();
                        newUser.username = '';
                        newUser.password = '';
                        newUser.role = 'user';
                    } catch (err) {
                        ElementPlus.ElMessage.error('创建失败: ' + (err.response?.data?.detail || err.message));
                    } finally {
                        creating.value = false;
                    }
                };

                const handleDelete = async (row) => {
                    try {
                        await ElementPlus.ElMessageBox.confirm('确认删除该用户吗？', '提示', {
                            confirmButtonText: '确定',
                            cancelButtonText: '取消',
                            type: 'warning'
                        });
                        
                        const token = localStorage.getItem('token');
                        await axios.delete(`/api/auth/users/${row.id}`, {
                            headers: { Authorization: `Bearer ${token}` }
                        });
                        ElementPlus.ElMessage.success('删除成功');
                        fetchUsers();
                    } catch (e) {
                        if (e !== 'cancel') {
                            ElementPlus.ElMessage.error('删除失败');
                        }
                    }
                };

                onMounted(() => {
                    if (!['admin', 'root'].includes(userRole.value)) {
                        ElementPlus.ElMessage.error('无权访问');
                        setTimeout(() => window.location.href = '/', 1000);
                        return;
                    }
                    fetchUsers();
                });

                return {
                    isCollapse,
                    users,
                    loading,
                    dialogVisible,
                    creating,
                    newUser,
                    username,
                    userRole,
                    handleMenuSelect,
                    handleCommand,
                    handleCreate,
                    handleDelete
                };
            }
        });

        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }
        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
