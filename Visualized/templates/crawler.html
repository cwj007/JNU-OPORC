<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爬虫管理 - JNU-OPORC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css">
    <link rel="stylesheet" href="/static/css/style.css?t={{ range(1, 10000) | random }}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-plus"></script>
    <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue"></script>
</head>
<body>
    <div id="app">
        <!-- 数据流动画容器 -->
        <div class="data-stream-container" id="dataStream"></div>

        <div class="sidebar" :class="{ collapsed: isCollapse }">
            <div class="sidebar-logo">{{ isCollapse ? 'OPORC' : 'JNU-OPORC 舆情哨兵' }}</div>
            <el-menu
                active-text-color="var(--primary-color)"
                background-color="transparent"
                class="el-menu-vertical"
                default-active="crawler"
                :collapse="isCollapse"
                text-color="var(--text-secondary)"
                @select="handleMenuSelect"
            >
                <el-menu-item index="hotsearch">
                    <el-icon><trend-charts /></el-icon>
                    <template #title>平台热榜</template>
                </el-menu-item>
                <el-menu-item index="dashboard">
                    <el-icon><data-line /></el-icon>
                    <template #title>舆情仪表盘</template>
                </el-menu-item>
                <el-menu-item index="monitor">
                    <el-icon><monitor /></el-icon>
                    <template #title>舆情检测</template>
                </el-menu-item>
                <el-menu-item index="warning">
                    <el-icon><bell /></el-icon>
                    <template #title>预警中心</template>
                </el-menu-item>
                <el-menu-item index="volume_rank">
                    <el-icon><histogram /></el-icon>
                    <template #title>声量热榜</template>
                </el-menu-item>
                <el-menu-item index="crawler">
                    <el-icon><share /></el-icon>
                    <template #title>爬虫管理</template>
                </el-menu-item>
                <el-menu-item index="settings">
                    <el-icon><setting /></el-icon>
                    <template #title>系统配置</template>
                </el-menu-item>
            </el-menu>
        </div>

        <div class="main-container">
            <div class="header">
                <div style="display: flex; align-items: center;">
                    <el-icon class="collapse-btn" @click="isCollapse = !isCollapse">
                        <expand v-if="isCollapse"></expand>
                        <fold v-else></fold>
                    </el-icon>
                    <el-breadcrumb separator="/">
                        <el-breadcrumb-item>首页</el-breadcrumb-item>
                        <el-breadcrumb-item>爬虫管理</el-breadcrumb-item>
                    </el-breadcrumb>
                </div>
            </div>

            <div class="content">
                <el-row :gutter="20">
                    <el-col :span="8">
                        <el-card shadow="never" header="爬虫控制台">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                                <span>当前状态：</span>
                                <span style="font-weight: bold; color: var(--primary-color);">{{ crawlerStatus.isRunning ? '运行中' : '空闲' }}</span>
                            </div>
                            
                            <el-form :model="crawlerConfig" label-width="80px">
                                <el-form-item label="平台">
                                    <el-select v-model="crawlerConfig.platform" placeholder="选择平台">
                                        <el-option label="微博" value="wb"></el-option>
                                        <el-option label="小红书" value="xhs"></el-option>
                                        <el-option label="抖音" value="dy"></el-option>
                                    </el-select>
                                </el-form-item>
                                <el-form-item label="类型">
                                    <el-select v-model="crawlerConfig.type" placeholder="爬取类型">
                                        <el-option label="搜索" value="search"></el-option>
                                        <el-option label="详情" value="detail"></el-option>
                                        <el-option label="评论" value="comments"></el-option>
                                    </el-select>
                                </el-form-item>
                                <el-form-item label="关键词">
                                    <el-input v-model="crawlerConfig.keywords" placeholder="输入关键词，逗号分隔"></el-input>
                                </el-form-item>
                                <el-form-item>
                                    <el-button type="primary" @click="startCrawler" :loading="crawlerStatus.isRunning" :disabled="crawlerStatus.isRunning">
                                        {{ crawlerStatus.isRunning ? '正在运行' : '启动爬虫' }}
                                    </el-button>
                                    <el-button type="danger" @click="stopCrawler" :disabled="!crawlerStatus.isRunning">
                                        停止
                                    </el-button>
                                </el-form-item>
                            </el-form>

                            <div style="margin-top: 10px; color: var(--text-secondary); font-size: 13px;">
                                <p>提示：爬虫将在后台运行，日志将实时显示在右侧。</p>
                            </div>
                        </el-card>

                        <el-card shadow="never" header="定时任务" style="margin-top: 20px;">
                            <el-empty description="暂无定时任务" :image-size="100"></el-empty>
                        </el-card>
                    </el-col>

                    <el-col :span="16">
                        <el-card shadow="never" header="实时日志">
                            <div class="log-container" ref="logContainer">
                                <div v-for="(log, index) in logs" :key="index" class="log-line" :class="getLogClass(log)">
                                    {{ log }}
                                </div>
                                <div v-if="logs.length === 0" style="text-align: center; color: var(--text-secondary); padding-top: 150px;">
                                    等待日志输出...
                                </div>
                            </div>
                        </el-card>
                    </el-col>
                </el-row>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, onUnmounted, nextTick } = Vue;

        const app = createApp({
            setup() {
                const isCollapse = ref(false);
                const crawlerStatus = ref({ isRunning: false });
                const crawlerConfig = ref({
                    platform: 'wb',
                    type: 'search',
                    keywords: ''
                });
                const logs = ref([]);
                const logContainer = ref(null);
                let logInterval = null;

                const startCrawler = async () => {
                    if (!crawlerConfig.value.keywords) {
                        ElementPlus.ElMessage.warning('请输入关键词');
                        return;
                    }
                    try {
                        const res = await axios.post('/api/crawler/start', crawlerConfig.value);
                        if (res.data.status === 'success') {
                            ElementPlus.ElMessage.success('爬虫已启动');
                            crawlerStatus.value.isRunning = true;
                            startLogPolling();
                        } else {
                            ElementPlus.ElMessage.error('启动失败: ' + res.data.message);
                        }
                    } catch (e) {
                        console.error(e);
                        ElementPlus.ElMessage.error('请求失败');
                    }
                };

                const stopCrawler = async () => {
                    try {
                        const res = await axios.post('/api/crawler/stop');
                        if (res.data.status === 'success') {
                            ElementPlus.ElMessage.success('已发送停止指令');
                            crawlerStatus.value.isRunning = false;
                            stopLogPolling();
                        }
                    } catch (e) {
                        console.error(e);
                        ElementPlus.ElMessage.error('停止失败');
                    }
                };

                const fetchLogs = async () => {
                    try {
                        const res = await axios.get('/api/crawler/logs');
                        if (res.data.logs && res.data.logs.length > 0) {
                            // 这里简单追加，实际可能需要去重或基于时间戳
                            // 模拟演示：只取最后20条
                            logs.value = res.data.logs;
                            scrollToBottom();
                        }
                        crawlerStatus.value.isRunning = res.data.isRunning;
                        if (!res.data.isRunning) {
                             stopLogPolling();
                        }
                    } catch (e) {
                        console.error('Fetch logs failed', e);
                    }
                };

                const startLogPolling = () => {
                    if (logInterval) clearInterval(logInterval);
                    logInterval = setInterval(fetchLogs, 2000);
                };

                const stopLogPolling = () => {
                    if (logInterval) clearInterval(logInterval);
                    logInterval = null;
                };

                const scrollToBottom = () => {
                    nextTick(() => {
                        if (logContainer.value) {
                            logContainer.value.scrollTop = logContainer.value.scrollHeight;
                        }
                    });
                };

                const getLogClass = (log) => {
                    if (log.includes('ERROR')) return 'log-error';
                    if (log.includes('WARNING')) return 'log-warning';
                    if (log.includes('SUCCESS') || log.includes('Saved')) return 'log-success';
                    if (log.includes('INFO')) return 'log-info';
                    return '';
                };

                const handleMenuSelect = (index) => {
                    console.log('Menu selected:', index);
                    if (!index) return;
                    
                    const currentPath = window.location.pathname;
                    const targetPath = index === 'dashboard' ? '/' : `/${index}`;
                    
                    if (currentPath === targetPath || (currentPath === '/' && index === 'dashboard')) {
                        console.log('Already on target page:', index);
                        return;
                    }

                    const externalPages = ['hotsearch', 'volume_rank', 'crawler', 'monitor', 'warning'];
                    if (externalPages.includes(index)) {
                        window.location.href = `/${index}`;
                    } else if (index === 'settings') {
                        window.location.href = '/?menu=settings';
                    } else if (index === 'dashboard') {
                        window.location.href = '/';
                    }
                };

                onMounted(() => {
                    // 初始化数据流粒子动画
                    const container = document.getElementById('dataStream');
                    if (container) {
                        const particleCount = 20;
                        for (let i = 0; i < particleCount; i++) {
                            const particle = document.createElement('div');
                            particle.className = 'data-particle';
                            particle.style.left = Math.random() * 100 + 'vw';
                            particle.style.animationDuration = (Math.random() * 3 + 2) + 's';
                            particle.style.animationDelay = Math.random() * 5 + 's';
                            container.appendChild(particle);
                        }
                    }
                });

                onUnmounted(() => {
                    stopLogPolling();
                });

                return {
                    isCollapse, crawlerStatus, crawlerConfig, logs, logContainer,
                    startCrawler, stopCrawler, getLogClass, handleMenuSelect
                };
            }
        });

        app.use(ElementPlus);
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }
        app.mount('#app');
    </script>
</body>
</html>
