<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爬虫管理 - JNU-OPORC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/element-plus"></script>
    <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue"></script>
    <style>
        :root { --bg-color: #f5f7fa; --sidebar-width: 240px; }
        body { margin: 0; background-color: var(--bg-color); font-family: sans-serif; }
        #app { display: flex; height: 100vh; }
        .sidebar { width: var(--sidebar-width); background-color: #304156; color: #fff; flex-shrink: 0; }
        .sidebar-logo { height: 60px; line-height: 60px; text-align: center; font-weight: bold; border-bottom: 1px solid #1f2d3d; }
        .main-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { height: 60px; background: #fff; display: flex; align-items: center; padding: 0 20px; box-shadow: 0 1px 4px rgba(0,21,41,.08); }
        .content { padding: 20px; flex: 1; overflow-y: auto; }
        .log-container { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 4px; font-family: monospace; height: 400px; overflow-y: auto; margin-top: 20px; font-size: 13px; line-height: 1.5; }
        .log-line { margin-bottom: 4px; border-left: 3px solid transparent; padding-left: 8px; }
        .log-info { color: #4fc1ff; }
        .log-error { color: #f44747; border-left-color: #f44747; }
        .log-warning { color: #dcdcaa; border-left-color: #dcdcaa; }
        .log-success { color: #6a9955; }
        .status-bar { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="sidebar">
            <div class="sidebar-logo">JNU-OPORC</div>
            <el-menu background-color="#304156" text-color="#fff" active-text-color="#409EFF" default-active="crawler">
                <el-menu-item index="dashboard" @click="location.href='/'">
                    <el-icon><odometer /></el-icon><span>控制台</span>
                </el-menu-item>
                <el-menu-item index="crawler">
                    <el-icon><share /></el-icon><span>爬虫管理</span>
                </el-menu-item>
            </el-menu>
        </div>
        <div class="main-container">
            <div class="header">
                <el-breadcrumb separator="/">
                    <el-breadcrumb-item>首页</el-breadcrumb-item>
                    <el-breadcrumb-item>爬虫管理</el-breadcrumb-item>
                </el-breadcrumb>
            </div>
            <div class="content">
                <el-card shadow="never">
                    <template #header>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span>爬虫控制面板</span>
                            <el-tag :type="status === 'running' ? 'success' : 'info'">{{ status === 'running' ? '运行中' : '空闲' }}</el-tag>
                        </div>
                    </template>
                    
                    <el-form :model="form" label-width="100px" style="max-width: 600px;">
                        <el-form-item label="目标平台">
                            <el-select v-model="form.platform" placeholder="选择平台">
                                <el-option label="微博" value="weibo"></el-option>
                                <el-option label="小红书" value="xhs"></el-option>
                                <el-option label="抖音" value="dy"></el-option>
                            </el-select>
                        </el-form-item>
                        <el-form-item label="爬取类型">
                            <el-radio-group v-model="form.crawler_type">
                                <el-radio label="search">关键词搜索</el-radio>
                                <el-radio label="detail">指定ID爬取</el-radio>
                            </el-radio-group>
                        </el-form-item>
                        <el-form-item label="登录方式">
                            <el-radio-group v-model="form.login_type">
                                <el-radio label="qrcode">二维码登录</el-radio>
                                <el-radio label="cookie">Cookie登录</el-radio>
                            </el-radio-group>
                        </el-form-item>
                        <el-form-item>
                            <el-button type="primary" @click="startCrawler" :loading="loading" :disabled="status === 'running'">启动爬虫</el-button>
                            <el-button type="danger" @click="stopCrawler" :disabled="status !== 'running'">停止爬虫</el-button>
                        </el-form-item>
                    </el-form>
                </el-card>

                <div class="log-container" ref="logBox">
                    <div v-for="log in logs" :key="log.id" class="log-line" :class="'log-' + log.level">
                        <span style="color: #858585;">[{{ log.timestamp }}]</span>
                        <span style="margin-left: 10px;">{{ log.message }}</span>
                    </div>
                    <div v-if="logs.length === 0" style="text-align: center; color: #555; margin-top: 180px;">暂无运行日志</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, nextTick } = Vue;
        const app = createApp({
            setup() {
                const status = ref('idle');
                const loading = ref(false);
                const logs = ref([]);
                const logBox = ref(null);
                const form = ref({
                    platform: 'weibo',
                    crawler_type: 'search',
                    login_type: 'qrcode'
                });

                const fetchStatus = async () => {
                    try {
                        const res = await axios.get('/api/crawler/status');
                        status.value = res.data.status;
                    } catch (e) { console.error('Failed to fetch status', e); }
                };

                const startCrawler = async () => {
                    loading.value = true;
                    try {
                        await axios.post('/api/crawler/start', form.value);
                        ElementPlus.ElMessage.success('爬虫已启动');
                        status.value = 'running';
                        logs.value = []; // 清空旧日志
                    } catch (e) {
                        ElementPlus.ElMessage.error(e.response?.data?.detail || '启动失败');
                    } finally { loading.value = false; }
                };

                const stopCrawler = async () => {
                    try {
                        await axios.post('/api/crawler/stop');
                        ElementPlus.ElMessage.warning('正在停止...');
                    } catch (e) {
                        ElementPlus.ElMessage.error('停止失败');
                    }
                };

                const initWebSocket = () => {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const ws = new WebSocket(`${protocol}//${window.location.host}/api/ws/logs`);
                    
                    ws.onmessage = (event) => {
                        const log = JSON.parse(event.data);
                        logs.value.push(log);
                        if (logs.value.length > 500) logs.value.shift();
                        
                        // 自动滚动到底部
                        nextTick(() => {
                            if (logBox.value) {
                                logBox.value.scrollTop = logBox.value.scrollHeight;
                            }
                        });
                        
                        // 如果日志提到“完成”或“结束”，更新状态
                        if (log.message.includes('完成') || log.message.includes('Finished')) {
                            fetchStatus();
                        }
                    };

                    ws.onclose = () => {
                        console.log('WS closed, reconnecting...');
                        setTimeout(initWebSocket, 3000);
                    };
                };

                onMounted(() => {
                    fetchStatus();
                    initWebSocket();
                    // 注册图标
                    for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
                        app.component(key, component);
                    }
                });

                return { form, status, loading, logs, logBox, startCrawler, stopCrawler };
            }
        });
        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
