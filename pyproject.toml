    "requests",
    "pytz",
    "PyYAML>=6.0.3,<7.0.0",
    "fastmcp>=2.12.0,<2.14.0",
    "websockets>=15.0.1",
    "torch>=2.0.0",
    "transformers>=4.45.0",
    "scikit-learn>=1.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.65.0",
    "seaborn>=0.11.0",
    "rich>=13.0.0",
    "peft>=0.12.0",
    "bitsandbytes>=0.40.0",
    "accelerate>=0.21.0",
    "sentencepiece",
    "einops",
    "tiktoken",
    "huggingface-hub>=0.25.0",
